# Confirmatory data collection for the CPU world model on GitHub-hosted
# runners (independent hardware and kernels; docs/WORLD_MODEL_EXPERIMENTS.md).
# Runs only on pushes to research/wm-collect-* branches, never on main. Each
# run uses disposable, unprivileged containers on the runner VM; limits are
# changed only on those containers, with `docker update`.
name: wm-collect

on:
  push:
    branches: ["research/wm-collect-*"]

permissions:
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Record the environment
        run: |
          mkdir -p out
          { uname -a; nproc; cat /sys/fs/cgroup/cgroup.controllers; docker info --format '{{json .}}'; } > out/runner-environment.txt
          cat out/runner-environment.txt | head -5
      - name: Build the lab image
        run: |
          docker build -q -t osie-linux-dev -f docker/linux-dev.Dockerfile docker/
          docker build -q -t osie-wm-lab -f ml/world_model/lab.Dockerfile .
      - name: Request-server families (held-in and confirmatory)
        run: |
          python3 ml/world_model/collect.py --out out/main --lanes 1 --lane-cpus 0-3 \
            --run-prefix "${{ matrix.runner }}-" --runs-per-family 3 --episodes 10 --seed 4242 \
            --families arith,hash,short,burst,mixed,variable,closed,wide,hashbig
      - name: Closed-loop batch class
        run: |
          python3 ml/world_model/collect.py --out out/batch --lanes 1 --lane-cpus 0-3 \
            --run-prefix "${{ matrix.runner }}-" --batch --families batch --runs-per-family 3 --episodes 8 --seed 4343
      - name: Compress
        run: gzip -9 out/*/episodes.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: wm-${{ matrix.runner }}
          path: out/
          retention-days: 30
