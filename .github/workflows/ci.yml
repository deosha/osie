name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja googletest
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev
      - name: Build
        run: cmake -S . -B build -G Ninja -DOSIE_WERROR=ON -DOSIE_BUILD_BENCHMARKS=OFF && ninja -C build
      - name: Unit tests
        run: ./build/osie_unit_tests
      - name: Platform tests (live kernel)
        run: ./build/osie_platform_tests
      - name: Root-only checks (config ownership; API peers of other users)
        if: runner.os == 'Linux'
        run: |
          sudo ./build/osie_unit_tests --gtest_filter='AgentConfig.*'
          sudo ./build/osie_platform_tests --gtest_filter='ApiLinuxPeers.*'
      - name: Local API benchmark (unprivileged; 60 s idle phases)
        if: runner.os == 'Linux'
        run: |
          nproc; uname -r
          packaging/agent/api_bench.sh build/osie-agent build/osie_api_bench 60 | tee api-bench.jsonl
      - name: ASan + UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DOSIE_SANITIZE=address,undefined -DCMAKE_BUILD_TYPE=Debug -DOSIE_BUILD_BENCHMARKS=OFF
          ninja -C build-asan
          ./build-asan/osie_unit_tests
          ./build-asan/osie_platform_tests
      - name: TSan (unit tests)
        run: |
          cmake -S . -B build-tsan -G Ninja -DOSIE_SANITIZE=thread -DCMAKE_BUILD_TYPE=Debug -DOSIE_BUILD_BENCHMARKS=OFF
          ninja -C build-tsan osie_unit_tests
          ./build-tsan/osie_unit_tests
      - name: Install and smoke-test the package
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSIE_BUILD_TESTS=OFF -DOSIE_BUILD_BENCHMARKS=OFF -DOSIE_PORTABLE=ON
          ninja -C build-rel osie osie_agent
          (cd build-rel && cpack -G TGZ)
          packaging/smoke_test.sh build-rel/osie-*.tar.gz

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-18-dev
      - name: Build libFuzzer harness (ASan + UBSan)
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang \
                -DOSIE_FUZZ=ON -DOSIE_SANITIZE=address,undefined -DOSIE_BUILD_TESTS=OFF -DOSIE_BUILD_BENCHMARKS=OFF
          ninja -C build-fuzz osie_fuzz_model osie_fuzz_world_model osie_fuzz_api
      - name: Fuzz the intent model loader (5 minutes, seeded with tiny models of each architecture)
        run: |
          mkdir -p corpus && cp tests/fuzz/seeds/*.osiem corpus/
          ./build-fuzz/osie_fuzz_model -max_total_time=300 -max_len=8192 -rss_limit_mb=2048 corpus
      - name: Fuzz the world model loader (3 minutes, seeded with OSIEWM1/OSIEWM2 models)
        run: |
          mkdir -p corpus_wm && cp tests/fuzz/seeds/*.osiewm corpus_wm/
          ./build-fuzz/osie_fuzz_world_model -max_total_time=180 -max_len=8192 -rss_limit_mb=2048 corpus_wm
      - name: Fuzz the local API request path (5 minutes, seeded with valid requests)
        run: |
          mkdir -p corpus_api && cp tests/fuzz/seeds/api/*.http corpus_api/
          ./build-fuzz/osie_fuzz_api -max_total_time=300 -max_len=20000 -rss_limit_mb=2048 -timeout=10 corpus_api

  packaging:
    # Clean install, upgrade from the previous release, and uninstall of the
    # x86-64 .deb/.rpm/.tar.gz (arm64 is covered by the same script locally).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release packages
        run: mkdir -p pkg && packaging/build_linux_release.sh pkg
      - name: Previous release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old && cd old
          gh release download v0.1.0 -R "${{ github.repository }}" -p 'osie_0.1.0_amd64.deb' -p 'osie-0.1.0-1.x86_64.rpm' -p SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
      - name: Install, upgrade, uninstall
        run: packaging/upgrade_test.sh pkg old

  agent-systemd:
    # The opt-in background agent as a real systemd service on a GitHub-hosted
    # VM: installed disabled, unprivileged, no IP sockets, reload, restarts,
    # bad config, removal; then a resource measurement at the default settings.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release packages
        run: mkdir -p pkg && packaging/build_linux_release.sh pkg
      - name: systemd integration test
        run: sudo packaging/agent/agent_systemd_test.sh pkg/osie_*_amd64.deb
      - name: Resource use (5 min, default configuration, unprivileged)
        run: |
          sudo dpkg -i pkg/osie_*_amd64.deb >/dev/null
          nproc; uname -r
          osie-agent --duration 300 --report --measure-freshness | tee agent-report.json
          python3 -c "import json; d=json.load(open('agent-report.json')); print('rss_mb', d['rss_mb'], 'cpu_share', d['cpu_share_of_one_core'], 'shutdown_ms', d['shutdown_ms'], 'jitter', d['health']['start_jitter'])"
      - name: Soak (10 min, 2000 processes with churn, unprivileged)
        run: packaging/agent/agent_soak.sh "$(command -v osie-agent)" 600 2000 50 1s

  python-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build && pip install numpy
      - run: cmake -S . -B build -G Ninja -DOSIE_BUILD_TESTS=OFF -DOSIE_BUILD_BENCHMARKS=OFF && ninja -C build osie_eval
      - name: C++/Python tokenizer and feature-hash parity
        run: python3 ml/evaluation/check_parity.py build/osie_eval
      - name: JSON outputs match docs/schemas (parse/ask on the v0.2 sets; predict on Linux)
        run: |
          python3 -m pip install --upgrade "jsonschema>=4.18" referencing
          ninja -C build osie
          python3 tests/check_json_schemas.py build/osie
      - name: Local API responses match docs/schemas (live agent, API enabled)
        run: |
          ninja -C build osie_agent
          python3 tests/check_api_schemas.py build/osie-agent
      - name: Frozen v0.2 intent test set (rules must not regress below the reported result)
        run: |
          python3 ml/datasets/v02/evaluate.py --split test --binary build/osie_eval | tee eval.txt
          python3 - <<'PY'
          vals = dict(l.split(None, 1) for l in open("eval.txt") if l.strip() and not l.startswith("e2e_by"))
          assert float(vals["false_safe_routing"]) == 0.0, "a directive was routed to an informational intent"
          assert float(vals["e2e_frame_acc"]) >= 0.89, vals["e2e_frame_acc"]
          PY

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
